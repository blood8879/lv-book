# Flutter gen-l10n config. Do NOT edit lib/l10n/app_*.arb by hand:
# edit lib/l10n/src/<area>_<locale>.arb and run `tool/l10n.sh`.
# See docs/i18n-guide.md.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-dir: lib/l10n/gen
output-localization-file: app_localizations.dart
output-class: AppLocalizations
preferred-supported-locales: [en]
nullable-getter: true
required-resource-attributes: false
untranslated-messages-file: build/l10n_untranslated.txt
